  <script>
    /**
     * AI TOEIC® L&R Mastery Pro - Standalone Client Engine
     */

    // --- Safe JSON & Global Error Barrier ---
    function safeJsonParse(raw, fallback = []) {
      if (!raw) return fallback;
      try {
        if (typeof raw !== 'string') return raw;
        const cleaned = raw.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '');
        const parsed = JSON.parse(cleaned);
        return parsed !== null && parsed !== undefined ? parsed : fallback;
      } catch (e) {
        console.warn('safeJsonParse fallback:', e);
        return fallback;
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escapeAttr(str) {
      if (!str) return '';

      speak(text, rate = null, onEndCallback = null) {
        if (!('speechSynthesis' in window)) {
          showBanner('お使いのブラウザは音声合成に対応していません', 'error');
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = rate || Store.config.ttsRate || 1.0;
        
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Daniel')) && v.lang.startsWith('en')) || voices.find(v => v.lang.startsWith('en'));
        if (enVoice) utterance.voice = enVoice;

        this.isPlaying = true;

        utterance.onend = () => {
          this.isPlaying = false;
          if (onEndCallback) onEndCallback();
          const p34Btn = document.getElementById('p34-play-full-btn');
          if (p34Btn) {
            p34Btn.innerHTML = `<span>🔊</span> 全文通し再生`;

          if (p34Btn) {
            p34Btn.innerHTML = `<span>🔊</span> 全文通し再生`;

          }
        };

        window.speechSynthesis.speak(utterance);
      },

      stop() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        this.isPlaying = false;
        const p34Btn = document.getElementById('p34-play-full-btn');
        if (p34Btn) {

    // --- Gemini Client ---
    const GeminiClient = {
      async call(prompt, systemInstruction = '', jsonMode = true, retryWithFallback = true) {
        const apiKey = Store.config.geminiKey.trim();
        let model = Store.config.geminiModel.trim() || 'gemini-3.5-flash-lite';

        if (!apiKey) {
          console.warn('Gemini API Key not set.');
          return null;
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: { temperature: 0.7 }
        };

        if (systemInstruction) {
          payload.systemInstruction = { parts: [{ text: systemInstruction }] };
        }
        if (jsonMode) {
          payload.generationConfig.responseMimeType = "application/json";
        }

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          const errMsg = err.error?.message || `HTTP ${response.status}: ${response.statusText}`;

          if (retryWithFallback && (errMsg.includes('no longer available') || errMsg.includes('not found') || response.status === 404)) {
            Store.config.geminiModel = 'gemini-3.5-flash-lite';
            localStorage.setItem('eng_gemini_model', 'gemini-3.5-flash-lite');
            return await this.call(prompt, systemInstruction, jsonMode, false);
          }
          throw new Error(errMsg);
        }

        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (jsonMode) {
          const parsed = safeJsonParse(text, null);
          if (parsed !== null) return parsed;
          const match = text.match(/(\[[\s\S]*\]|\{[\s\S]*\})/);
          if (match) return safeJsonParse(match[1], null);
          return null;
        }
        return text;
      }
    };

      if (autoStart) startPart5Timer();
    }

    function togglePart5Timer() {
      if (ToeicState.p5TimerRunning) {
        clearInterval(ToeicState.p5Timer);
        ToeicState.p5TimerRunning = false;
        const toggleBtn = document.getElementById('p5-timer-toggle-btn');
        const textEl = document.getElementById('p5-timer-text');
        if (toggleBtn) {
          toggleBtn.innerHTML = `<span>▶️</span><span>再開</span>`;
          toggleBtn.className = 'px-3 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-sm flex items-center gap-1 transition-all active:scale-95';
        }
        if (textEl) {
          textEl.textContent = `${ToeicState.p5TimeLeft}s (一時停止)`;
          textEl.className = 'text-amber-400 font-bold';
        }
      } else {
        startPart5Timer();
      }
    }

    function startPart5Timer() {
      clearInterval(ToeicState.p5Timer);
      ToeicState.p5TimerRunning = true;
      const textEl = document.getElementById('p5-timer-text');
      const barEl = document.getElementById('p5-timer-bar');
      const toggleBtn = document.getElementById('p5-timer-toggle-btn');

      if (toggleBtn) {
        toggleBtn.innerHTML = `<span>⏸️</span><span>一時停止</span>`;
        toggleBtn.className = 'px-3 py-1 rounded-lg bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-sm flex items-center gap-1 transition-all active:scale-95';
      }
      if (barEl) {
        barEl.className = 'h-full bg-gradient-to-r from-emerald-500 to-amber-500 transition-all duration-1000 w-full';
      }

      textEl.textContent = `${ToeicState.p5TimeLeft}s`;
      textEl.className = 'text-amber-400 font-bold';

      ToeicState.p5Timer = setInterval(() => {
        ToeicState.p5TimeLeft--;
        textEl.textContent = `${ToeicState.p5TimeLeft}s`;
        const pct = (ToeicState.p5TimeLeft / 20) * 100;
        barEl.style.width = `${pct}%`;

        if (ToeicState.p5TimeLeft <= 5) {
          barEl.className = 'h-full bg-rose-500 transition-all duration-1000';
          textEl.className = 'text-rose-400 font-bold animate-pulse';
        }

        if (ToeicState.p5TimeLeft <= 0) {
          clearInterval(ToeicState.p5Timer);
          ToeicState.p5TimerRunning = false;
          handlePart5Answer(-1);
        }
      }, 1000);
    }

    function handlePart5Answer(selectedIdx) {
      clearInterval(ToeicState.p5Timer);
      ToeicState.p5TimerRunning = false;

      const toggleBtn = document.getElementById('p5-timer-toggle-btn');
      if (toggleBtn) {
        toggleBtn.innerHTML = `<span>⏹️</span><span>判定済</span>`;
        toggleBtn.className = 'px-3 py-1 rounded-lg bg-slate-800 text-slate-500 text-xs flex items-center gap-1 cursor-default';
      }

      const all = getAllPart5Questions().filter(q => ToeicState.levelFilter === 'all' || q.level === ToeicState.levelFilter);
      const q = all[ToeicState.p5Index];
      const isCorrect = selectedIdx === q.answer;

      if (isCorrect) {
        ToeicState.p5Score.correct++;
        ToeicState.p5Score.streak++;
      } else {
        ToeicState.p5Score.miss++;
        ToeicState.p5Score.streak = 0;
      }
      document.getElementById('p5-correct-cnt').textContent = ToeicState.p5Score.correct;
      document.getElementById('p5-miss-cnt').textContent = ToeicState.p5Score.miss;
      document.getElementById('p5-streak-cnt').textContent = ToeicState.p5Score.streak;

      const buttons = document.querySelectorAll('.p5-choice-btn');
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === q.answer) {
          btn.className = 'p5-choice-btn p-3.5 rounded-xl bg-emerald-950 border border-emerald-600 text-emerald-200 text-xs sm:text-sm font-bold flex items-center gap-2.5';
        } else if (idx === selectedIdx) {
          btn.className = 'p5-choice-btn p-3.5 rounded-xl bg-rose-950 border border-rose-600 text-rose-200 text-xs sm:text-sm font-bold flex items-center gap-2.5';
        }
      });

      const expBox = document.getElementById('p5-explanation-box');
      expBox.className = `p-4 rounded-xl border space-y-2.5 transition-all text-xs sm:text-sm ${isCorrect ? 'bg-emerald-950/80 border-emerald-700 text-emerald-200' : 'bg-rose-950/80 border-rose-700 text-rose-200'}`;
      expBox.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="font-bold text-sm sm:text-base">${isCorrect ? '🎉 正解！' : selectedIdx === -1 ? '⏱️ 時間切れ！' : '❌ 不正解'}（正解: (${String.fromCharCode(65 + q.answer)}) ${escapeHtml(q.choices[q.answer])}）</span>
          <button onclick="saveToeicDeskPhrase('${escapeAttr(q.sentence.replace('_______', q.choices[q.answer]))}', '${escapeAttr(q.jp)}', '${escapeAttr(q.explanation)}')" class="bg-slate-900 hover:bg-slate-800 text-slate-200 px-2.5 py-1 rounded border border-slate-700 text-xs flex items-center gap-1">
            💾 デスクに保存
          </button>
        </div>
        <p class="text-slate-300"><strong class="text-slate-400">訳:</strong> ${escapeHtml(q.jp)}</p>
        <div class="bg-slate-950/70 p-3 rounded-lg text-xs space-y-1 text-slate-300 font-sans border border-slate-800">
          <p><strong class="text-amber-400">💡 秒殺ポイント:</strong> ${escapeHtml(q.explanation)}</p>
        </div>
      `;
      expBox.classList.remove('hidden');
      AudioEngine.speak(q.sentence.replace('_______', q.choices[q.answer]));
    }

    function nextPart5Question() {
      loadPart5Question(ToeicState.p5Index + 1, false);
    }

    async function handleBatchGeneratePart5() {
      const btn = document.getElementById('p5-batch-generate-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block">🔄</span><span>AI生成中...</span>`;

      try {
        const level = ToeicState.levelFilter === 'all' ? '730' : ToeicState.levelFilter;
        const systemPrompt = `You are a strict TOEIC Part 5 question writer. Output a JSON array of exactly 5 realistic, high-quality TOEIC Part 5 multiple choice questions targeting score ${level}. Schema:
[
  {
    "category": "品詞問題 or 前置詞 vs 接続詞 or コロケーション or 時制",
    "level": "${level}",
    "sentence": "Business sentence with _______ as blank",
    "choices": ["Option A", "Option B", "Option C", "Option D"],
    "answer": 0,
    "jp": "自然な日本語訳",
    "explanation": "なぜその選択肢が正解かの明確な解説"
  }
]`;
        const prompt = `Generate 5 brand-new TOEIC Part 5 questions for ${level} score band.`;
        const res = await GeminiClient.call(prompt, systemPrompt, true);
        if (res && Array.isArray(res) && res.length > 0) {
          ToeicBank.cachedPart5.push(...res);
          localStorage.setItem('eng_toeic_cached_p5', JSON.stringify(ToeicBank.cachedPart5));
          updateToeicCounts();
          showBanner(`5問のPart 5問題を一括生成・蓄積しました！（API消費: 1回）`, 'success');
          loadPart5Question(getAllPart5Questions().length - 5, false);
        } else {
          showBanner('生成に失敗しました。内蔵問題をご利用ください。', 'info');
        }
      } catch (err) {
        console.error(err);
        showBanner(`AI生成エラー (${err.message})`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>✨</span><span>AIバッチ5問生成</span>`;
      }
    }

    // --- Part 3 & 4 Logic ---
    function loadPart34Scenario(index) {
      const all = getAllPart34Scenarios();
      ToeicState.p34Index = index % all.length;
      const item = all[ToeicState.p34Index];

      document.getElementById('p34-badge-type').textContent = item.type;
      document.getElementById('p34-title').textContent = item.title;

      const qContainer = document.getElementById('p34-questions-container');
      qContainer.innerHTML = item.questions.map((qObj, qIdx) => `
        <div class="bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-2 text-xs">
          <p class="font-bold text-slate-200">${escapeHtml(qObj.q)}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${qObj.choices.map((c, cIdx) => `
              <button onclick="handleP34Answer(${qIdx}, ${cIdx})" class="p34-q${qIdx}-choice p-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-left text-slate-300 transition-all flex items-center gap-2">
                <span class="w-5 h-5 rounded bg-slate-800 text-amber-400 font-bold flex items-center justify-center text-[10px]">${String.fromCharCode(65 + cIdx)}</span>
                <span class="flex-1">${escapeHtml(c)}</span>
              </button>
            `).join('')}
          </div>
          <div id="p34-q${qIdx}-exp" class="hidden text-[11px] p-2 rounded bg-slate-900 text-emerald-300 font-sans border border-emerald-900/40">
            ${escapeHtml(qObj.explanation)}
          </div>
        </div>
      `).join('');

      const linkingBox = document.getElementById('p34-linking-box');
      linkingBox.innerHTML = `
        <h4 class="font-bold text-rose-400 flex items-center gap-1.5 border-b border-slate-800 pb-1">
          <span>🔗</span> この音源の難所リンキング（音の連結・脱落）
        </h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          ${item.linkingTips.map(l => `
            <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800 space-y-0.5">
              <div class="flex items-center justify-between">
                <span class="font-bold text-white">${escapeHtml(l.chunk)}</span>
                <button onclick="AudioEngine.speak('${escapeAttr(l.chunk)}', 0.8)" class="text-slate-400 hover:text-white text-xs">🔊</button>
              </div>
              <p class="text-accent-400 font-mono text-[11px]">${escapeHtml(l.sound)}</p>
              <p class="text-slate-400 text-[10px]">${escapeHtml(l.tip)}</p>
            </div>
          `).join('')}
        </div>
      `;

      const scriptBox = document.getElementById('p34-script-box');
      scriptBox.innerHTML = `
        <h4 class="font-bold text-slate-300 flex items-center gap-1.5 border-b border-slate-800 pb-1">
          <span>📝</span> 全文スクリプト（タップで1文ずつリピート再生）
        </h4>
        <div class="space-y-2">
          ${item.scriptLines.map(line => `
            <div onclick="AudioEngine.speak('${escapeAttr(line.text)}', ToeicState.p34Speed)" class="p-2.5 rounded-lg bg-slate-900 hover:bg-slate-800/80 cursor-pointer border border-slate-800/80 transition-all flex items-start gap-2 group">
              <span class="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] font-bold text-amber-400 flex-shrink-0">${line.speaker}:</span>
              <div class="space-y-0.5 flex-1">
                <p class="text-slate-200 group-hover:text-white font-medium">${escapeHtml(line.text)}</p>
                <p class="text-[11px] text-slate-400">${escapeHtml(line.jp)}</p>
              </div>
              <span class="text-xs text-slate-500 group-hover:text-amber-400 flex-shrink-0">🔊</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function handleP34Answer(qIdx, cIdx) {
      const item = getAllPart34Scenarios()[ToeicState.p34Index];
      const qObj = item.questions[qIdx];
      const buttons = document.querySelectorAll(`.p34-q${qIdx}-choice`);
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === qObj.answer) {
          btn.className = 'p-2.5 rounded-lg bg-emerald-950 border border-emerald-600 text-emerald-200 text-left font-bold flex items-center gap-2';
        } else if (idx === cIdx) {
          btn.className = 'p-2.5 rounded-lg bg-rose-950 border border-rose-600 text-rose-200 text-left font-bold flex items-center gap-2';
        }
      });
      const expEl = document.getElementById(`p34-q${qIdx}-exp`);
      if (expEl) expEl.classList.remove('hidden');
    }

    async function handleBatchGeneratePart34() {
      const btn = document.getElementById('p34-batch-generate-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block">🔄</span><span>AI生成中...</span>`;

      try {
        const isPart3 = Math.random() > 0.5;
        const typeStr = isPart3 ? "Part 3: [対話] ビジネス会話" : "Part 4: [アナウンス] 業務連絡・説明";
        const level = ToeicState.levelFilter === 'all' ? '730' : ToeicState.levelFilter;

        const systemPrompt = `You are an expert TOEIC Part 3/4 listening test writer. Output a JSON object with this exact schema:
{
  "type": "${typeStr}",
  "title": "Short Japanese Title",
  "speakers": "e.g. Man, Woman",
  "audioText": "Full text about 45-60 words",
  "scriptLines": [
    { "speaker": "Speaker Name", "text": "English sentence", "jp": "日本語訳" }
  ],
  "linkingTips": [
    { "chunk": "Word linking chunk", "sound": "カタカナ発音", "tip": "解説" }
  ],
  "questions": [
    {
      "q": "1. Comprehension question in English?",
      "choices": ["Choice A", "Choice B", "Choice C", "Choice D"],
      "answer": 0,
      "explanation": "日本語による正解解説"
    },
    {
      "q": "2. Comprehension question in English?",
      "choices": ["Choice A", "Choice B", "Choice C", "Choice D"],
      "answer": 1,
      "explanation": "日本語による正解解説"
    },
    {
      "q": "3. Comprehension question in English?",
      "choices": ["Choice A", "Choice B", "Choice C", "Choice D"],
      "answer": 2,
      "explanation": "日本語による正解解説"
    }
  ]
}`;
        const prompt = `Generate a brand new realistic TOEIC ${typeStr} audio test scenario for ${level} level.`;
        const res = await GeminiClient.call(prompt, systemPrompt, true);
        if (res && res.audioText && res.questions && res.questions.length === 3) {
          ToeicBank.cachedPart34.push(res);
          localStorage.setItem('eng_toeic_cached_p34', JSON.stringify(ToeicBank.cachedPart34));
          updateToeicScenarioSelect();
          const newIdx = getAllPart34Scenarios().length - 1;
          document.getElementById('p34-scenario-select').value = newIdx;
          loadPart34Scenario(newIdx);
          showBanner(`新シナリオ「${res.title}」を追加しました！（API消費: 1回）`, 'success');
        } else {
          showBanner('生成に失敗しました。内蔵シナリオをご利用ください。', 'info');
        }
      } catch (err) {
        console.error(err);
        showBanner(`シナリオ生成エラー (${err.message})`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>✨</span><span>AI新シナリオ生成 (Part 3/4)</span>`;
      }
    }

    // --- Vocabulary Logic ---
    function renderToeicVocabList(searchQuery = '') {
      const container = document.getElementById('toeic-vocab-list');
      const query = searchQuery.toLowerCase().trim();
      const all = getAllToeicVocab().filter(v => 
        (ToeicState.levelFilter === 'all' || v.level === ToeicState.levelFilter) &&
        (v.word.toLowerCase().includes(query) || v.meaning.includes(query) || v.collocation.toLowerCase().includes(query))
      );

      if (all.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500 text-xs">該当する単語が見つかりません。</div>`;
        return;
      }

      container.innerHTML = all.map(v => `
        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 space-y-2.5 hover:border-amber-500/40 transition-all">
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-base sm:text-lg font-bold text-white">${escapeHtml(v.word)}</span>
                <span class="text-[10px] font-mono text-accent-400">[${escapeHtml(v.phonetic)}]</span>
                <span class="text-[10px] bg-slate-800 text-amber-300 px-1.5 py-0.5 rounded border border-slate-700">${v.pos}</span>
                <span class="text-[10px] bg-slate-950 text-slate-400 px-1.5 py-0.5 rounded">${v.level}点</span>
              </div>
              <p class="text-xs font-semibold text-slate-200 mt-1">${escapeHtml(v.meaning)}</p>
            </div>
            <button onclick="AudioEngine.speak('${escapeAttr(v.word)}')" class="p-2 rounded-lg bg-slate-800 hover:bg-amber-600 text-white text-xs border border-slate-700 flex-shrink-0" title="単語を発音">
              🔊
            </button>
          </div>

          <div class="bg-slate-950/80 p-2.5 rounded-lg border border-slate-800 text-xs space-y-1">
            <p class="text-amber-400 font-medium flex items-center justify-between">
              <span>🎯 頻出コロケーション: <strong>${escapeHtml(v.collocation)}</strong></span>
              <button onclick="AudioEngine.speak('${escapeAttr(v.collocation)}')" class="text-slate-400 hover:text-white">🔊</button>
            </p>
          </div>

          <div class="bg-slate-950/60 p-2.5 rounded-lg text-xs space-y-1 text-slate-300">
            <div class="flex items-start justify-between gap-1">
              <p class="font-medium text-white">${escapeHtml(v.exEn)}</p>
              <button onclick="AudioEngine.speak('${escapeAttr(v.exEn)}')" class="text-slate-400 hover:text-white flex-shrink-0">🔊</button>
            </div>
            <p class="text-[11px] text-slate-400">${escapeHtml(v.exJa)}</p>
          </div>

          <div class="flex justify-end pt-1">
            <button onclick="saveToeicDeskPhrase('${escapeAttr(v.exEn)}', '${escapeAttr(v.word + ' (' + v.meaning + '): ' + v.exJa)}', '${escapeAttr('コロケーション: ' + v.collocation)}')" class="text-[11px] bg-slate-800 hover:bg-emerald-700 text-emerald-300 px-2.5 py-1 rounded border border-slate-700 transition-all flex items-center gap-1">
              💾 デスクに保存
            </button>
          </div>
        </div>
      `).join('');
    }

    async function handleBatchGenerateVocab() {
      const btn = document.getElementById('toeic-vocab-batch-ai-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin inline-block">🔄</span><span>AI生成中...</span>`;

      try {
        const level = ToeicState.levelFilter === 'all' ? '730' : ToeicState.levelFilter;
        const systemPrompt = `You are a TOEIC vocabulary and collocation expert. Output a JSON array of exactly 5 high-frequency business English words for TOEIC score ${level}. Schema:
[
  {
    "word": "Target word",
    "phonetic": "カタカナ発音表記",
    "pos": "動詞/名詞/形容詞/副詞",
    "meaning": "日本語の重要語義",
    "collocation": "TOEIC頻出の塊表現（2〜3語）",

    "exJa": "例文の日本語訳",
    "level": "${level}"
  }
]`;
        const prompt = `Generate 5 high-yield TOEIC vocabulary words for ${level} level.`;
        const res = await GeminiClient.call(prompt, systemPrompt, true);
        if (res && Array.isArray(res) && res.length > 0) {
          ToeicBank.cachedVocab.push(...res);
          localStorage.setItem('eng_toeic_cached_vocab', JSON.stringify(ToeicBank.cachedVocab));
          updateToeicCounts();
          showBanner(`5つの頻出語彙・例文を追加しました！（API消費: 1回）`, 'success');
          renderToeicVocabList();
        } else {
          showBanner('生成に失敗しました。内蔵語彙をご利用ください。', 'info');
        }
      } catch (err) {
        console.error(err);
        showBanner(`語彙生成エラー (${err.message})`, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<span>✨</span><span>AIバッチ5単語生成</span>`;
      }
    }

    function saveToeicDeskPhrase(english, japanese, nuance) {
      Store.savedPhrases.unshift({
        english,
        japanese,
        katakana: '',
        nuance: nuance || '',
        savedAt: new Date().toISOString()
      });
      localStorage.setItem('eng_saved_phrases', JSON.stringify(Store.savedPhrases));
      showBanner(`フレーズを保存デスクに追加しました！`, 'success');
    }

    // --- Settings Modal Logic ---
    function openToeicSettings() {
      document.getElementById('toeic-setting-gemini-key').value = Store.config.geminiKey;
      document.getElementById('toeic-setting-gemini-model').value = Store.config.geminiModel;
      document.getElementById('toeic-setting-tts-rate').value = Store.config.ttsRate;
      document.getElementById('toeic-setting-tts-rate-label').textContent = `${Store.config.ttsRate.toFixed(1)}x`;
      document.getElementById('toeic-settings-modal').classList.remove('hidden');
    }
    function closeToeicSettings() {
      document.getElementById('toeic-settings-modal').classList.add('hidden');
    }
    function saveToeicSettings() {
      Store.config.geminiKey = document.getElementById('toeic-setting-gemini-key').value.trim();
      Store.config.geminiModel = document.getElementById('toeic-setting-gemini-model').value.trim();
      Store.config.ttsRate = parseFloat(document.getElementById('toeic-setting-tts-rate').value);

      localStorage.setItem('eng_gemini_key', Store.config.geminiKey);
      localStorage.setItem('eng_gemini_model', Store.config.geminiModel);
      localStorage.setItem('eng_tts_rate', Store.config.ttsRate);

      closeToeicSettings();
      showBanner('設定を保存しました！', 'success');
    }

    document.addEventListener('DOMContentLoaded', () => {
      initToeicModule();
      document.getElementById('toeic-setting-tts-rate')?.addEventListener('input', (e) => {
        document.getElementById('toeic-setting-tts-rate-label').textContent = `${parseFloat(e.target.value).toFixed(1)}x`;
      });
    });
  </script>
</body>
