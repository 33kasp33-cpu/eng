<!DOCTYPE html>
<html lang="ja" class="h-full bg-neutral-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC 600 RTA | SNS Promo Video Generator v3.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-full flex flex-col items-center justify-center p-4 md:p-8 select-none">

  <!-- TOP HEADER -->
  <div class="max-w-xl w-full text-center space-y-2 mb-6">
    <div class="inline-block px-3 py-1 bg-amber-950 border border-amber-800 text-amber-400 font-black text-xs rounded-full uppercase tracking-wider">
      TikTok / Shorts / X Promo Generator v3.0
    </div>
    <h1 class="text-2xl md:text-3xl font-black tracking-tight">
      リアル実演プロモ動画 自動生成エンジン
    </h1>
    <p class="text-xs md:text-sm text-neutral-400">
      人間味のあるランダム回答時間（1.1s〜2.2s）＆ 選択肢ランダムシャッフルでリアルな10連正解動画を出力します。
    </p>
  </div>

  <!-- CONTROL PANEL -->
  <div class="max-w-xl w-full bg-neutral-900 border border-neutral-800 rounded-2xl p-5 mb-6 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
      <div>
        <label class="block text-neutral-400 mb-1 font-bold">動画サイズ / 画角</label>
        <div class="p-2.5 bg-neutral-950 rounded border border-neutral-800 text-emerald-400 font-bold font-mono">
          縦型 9:16 (720 × 1280 HD)
        </div>
      </div>
      <div>
        <label class="block text-neutral-400 mb-1 font-bold">収録モード</label>
        <select id="videoModeSelect" class="w-full p-2.5 bg-neutral-950 rounded border border-neutral-800 text-white focus:outline-none focus:border-amber-400 font-bold">
          <option value="part5">Part 5 品詞パズル実演 (10問)</option>
          <option value="part67">Part 6/7 目的スナイプ実演 (10問)</option>
        </select>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-col sm:flex-row gap-3 pt-2">
      <button onclick="startRecording()" id="recordBtn" class="flex-1 py-4 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-black font-black text-sm md:text-base rounded-xl transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-2 cursor-pointer">
        <span>🎥</span>
        <span>動画を自動生成して保存 (.webm)</span>
      </button>
      <button onclick="previewOnly()" id="previewBtn" class="py-4 px-6 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-neutral-200 font-bold text-sm rounded-xl transition cursor-pointer">
        プレビュー再生
      </button>
    </div>

    <!-- STATUS BAR -->
    <div id="statusBox" class="hidden text-xs font-mono p-3 bg-neutral-950 rounded-lg border border-neutral-800 text-amber-400 flex items-center justify-between">
      <span id="statusText">レンダリング中: 0%</span>
      <span id="timerText">00.00s</span>
    </div>
  </div>

  <!-- CANVAS PREVIEW CONTAINER (9:16 Aspect Ratio) -->
  <div class="relative w-full max-w-[340px] aspect-[9/16] bg-black rounded-2xl overflow-hidden border-2 border-neutral-800 shadow-2xl">
    <canvas id="videoCanvas" width="720" height="1280" class="w-full h-full object-contain"></canvas>
  </div>

  <!-- FOOTER -->
  <div class="mt-6 text-center text-xs text-neutral-600 font-mono">
    TOEIC 600 HACK PROMO GENERATOR | ZERO-LATENCY SYSTEM
  </div>

  <script>
    /* ==========================================================================
       DEMO QUESTION DATA
       ========================================================================== */
    const DEMO_QUESTIONS = {
      part5: [
        { q: "The board members reached a final _____ yesterday.", opts: ["decide", "decision", "decisive", "decisively"], ans: 1, trigger: "冠詞 a + 形容詞 final の後 → 名詞 [-sion]" },
        { q: "The company needs a _____ supplier for materials.", opts: ["rely", "reliance", "reliable", "reliably"], ans: 2, trigger: "冠詞 a + _____ + 名詞 → 形容詞 [-able]" },
        { q: "The manager appreciated the _____ of the system.", opts: ["efficient", "efficiency", "efficiently", "efficiencies"], ans: 1, trigger: "冠詞 the + 前置詞 of の間 → 名詞 [-ty]" },
        { q: "The shipment was delivered _____ without damage.", opts: ["safe", "safely", "safety", "safeties"], ans: 1, trigger: "受動態 was delivered の後 → 副詞 [-ly]" },
        { q: "The committee will _____ review the proposal.", opts: ["careful", "carefully", "carefulness", "caring"], ans: 1, trigger: "助動詞 will + 本動詞の間 → 副詞 [-ly]" },
        { q: "Mr. Davis showed exceptional _____ conduct.", opts: ["profession", "professional", "professionally", "professionalism"], ans: 1, trigger: "形容詞 + _____ + 名詞 → 形容詞 [-al]" },
        { q: "Both parties finally signed the _____ yesterday.", opts: ["agree", "agreement", "agreeable", "agreeably"], ans: 1, trigger: "冠詞 the の後ろ（目的語）→ 名詞 [-ment]" },
        { q: "The firm revised its _____ strategy to boost sales.", opts: ["finance", "financial", "financially", "financier"], ans: 1, trigger: "所有格 its + _____ + 名詞 → 形容詞 [-al]" },
        { q: "Her outstanding _____ was recognized at the banquet.", opts: ["perform", "performance", "performer", "performed"], ans: 1, trigger: "所有格 + 形容詞の後 → 名詞 [-ance]" },
        { q: "The enterprise offers _____ prices to buyers.", opts: ["compete", "competition", "competitive", "competitively"], ans: 2, trigger: "動詞 offers + _____ + 名詞 → 形容詞 [-ive]" }
      ],
      part67: [
        { q: "Subject: Inquiry regarding bulk order discounts", opts: ["To request pricing info", "To cancel a shipment", "To complain of delay", "To apply for job"], ans: 0, trigger: "Subject: Inquiry regarding discounts → [価格の問い合わせ]" },
        { q: "I am writing to inquire about the warranty policy.", opts: ["To ask for policy details", "To request a refund", "To schedule repair", "To negotiate contract"], ans: 0, trigger: "I am writing to inquire → [問い合わせ (To ask)]" },
        { q: "Subject: Rescheduling of Friday's budget meeting", opts: ["To approve budget", "To change a meeting time", "To announce hiring", "To order supplies"], ans: 1, trigger: "Subject: Rescheduling → [会議日程の変更]" },
        { q: "We regret to inform you that the workshop is canceled.", opts: ["To announce a cancellation", "To schedule workshop", "To invite members", "To request feedback"], ans: 0, trigger: "We regret to inform ... canceled → [中止の通知]" },
        { q: "Apex Technologies is currently seeking a Sales Rep.", opts: ["To advertise open position", "To introduce rep", "To open new store", "To congratulate"], ans: 0, trigger: "currently seeking [役職] → [求人広告]" },
        { q: "This is a reminder that timesheets are due today.", opts: ["To remind of a deadline", "To introduce policy", "To recruit staff", "To grant time off"], ans: 0, trigger: "This is a reminder ... due → [提出期日のリマインド]" },
        { q: "Please be advised that the garage will be repaired.", opts: ["To inform of maintenance", "To sell passes", "To open facility", "To report accident"], ans: 0, trigger: "Please be advised ... maintenance → [保守点検の案内]" },
        { q: "Effective Oct 1, support hours will change to 8AM-6PM.", opts: ["To announce revised hours", "To hire staff", "To celebrate event", "To close department"], ans: 0, trigger: "Effective [日付], hours change → [営業時間変更]" },
        { q: "You are invited to attend the grand opening ceremony.", opts: ["To invite to an event", "To sell real estate", "To request funding", "To apply membership"], ans: 0, trigger: "You are invited to attend → [招待 (To invite)]" },
        { q: "Please find attached the finalized financial report.", opts: ["To provide documents", "To request invoice", "To delay payment", "To correct error"], ans: 0, trigger: "Please find attached the report → [書類送付]" }
      ]
    };

    /* ==========================================================================
       CANVAS 9:16 RENDERING ENGINE
       ========================================================================== */
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 720;
    const H = 1280;

    let isRecording = false;
    let isPreview = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let audioCtx = null;
    let audioDest = null;

    // Safe Canvas Drawing Helpers (100% Path-Isolated)
    function drawRoundRect(x, y, w, h, r, fillStyle, strokeStyle = null, lineWidth = 0) {
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, w, h, r);
      } else {
        ctx.rect(x, y, w, h);
      }
      if (fillStyle) {
        ctx.fillStyle = fillStyle;
        ctx.fill();
      }
      if (strokeStyle && lineWidth > 0) {
        ctx.strokeStyle = strokeStyle;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }
      ctx.closePath();
      ctx.restore();
    }

    function drawText(text, x, y, font, color, align = 'center', baseline = 'middle') {
      ctx.save();
      ctx.beginPath();
      ctx.font = font;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.textBaseline = baseline;
      ctx.fillText(text, x, y);
      ctx.closePath();
      ctx.restore();
    }

    // Web Audio Sound FX Generator
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioDest = audioCtx.createMediaStreamDestination();
      }
    }

    function playBeep(freq = 880, duration = 0.08, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioDest);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playFanfare() {
      if (!audioCtx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playBeep(freq, 0.25, 'triangle'), i * 120);
      });
    }

    /* ==========================================================================
       RECORDING & TIMELINE CONTROLS
       ========================================================================== */
    async function startRecording() {
      initAudio();
      isRecording = true;
      isPreview = false;
      document.getElementById('recordBtn').disabled = true;
      document.getElementById('previewBtn').disabled = true;
      document.getElementById('statusBox').classList.remove('hidden');

      const canvasStream = canvas.captureStream(60);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      recordedChunks = [];
      const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      let selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';

      mediaRecorder = new MediaRecorder(combinedStream, selectedMime ? { mimeType: selectedMime } : {});
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = exportVideoFile;
      mediaRecorder.start();

      await runPromoSequence();

      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('recordBtn').disabled = false;
      document.getElementById('previewBtn').disabled = false;
    }

    async function previewOnly() {
      initAudio();
      isRecording = false;
      isPreview = true;
      document.getElementById('recordBtn').disabled = true;
      document.getElementById('previewBtn').disabled = true;
      document.getElementById('statusBox').classList.remove('hidden');

      await runPromoSequence();

      isPreview = false;
      document.getElementById('recordBtn').disabled = false;
      document.getElementById('previewBtn').disabled = false;
    }

    function exportVideoFile() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `TOEIC600_RTA_Promo_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 500);
      document.getElementById('statusText').textContent = "✓ 動画のダウンロードが完了しました！";
    }

    /* ==========================================================================
       SCENE SEQUENCER (With Randomized Human-Like Timings & Dynamic Mode Titles)
       ========================================================================== */
    async function runPromoSequence() {
      const mode = document.getElementById('videoModeSelect').value;
      const rawQuestions = DEMO_QUESTIONS[mode];
      const totalStages = 10;

      // Realistic Human Answering Durations (in ms, randomized around 1.1s - 2.1s)
      const humanDurations = [1450, 1100, 1850, 1250, 1600, 1150, 2050, 1300, 1500, 1200];
      let accumulatedTimeMs = 0;

      // 1. Hook Intro Scene (1.8s) with Mode-Specific Title
      await renderIntroScene(mode, 1800);

      // 2. 10 Questions Solving Sequence
      for (let i = 0; i < totalStages; i++) {
        const rawQ = rawQuestions[i % rawQuestions.length];
        
        // DYNAMIC OPTION SHUFFLE (Eliminates positional bias, spreads across A,B,C,D)
        const correctAnswerText = rawQ.opts[rawQ.ans];
        const shuffledOpts = shuffleArray([...rawQ.opts]);
        const newAnswerIndex = shuffledOpts.indexOf(correctAnswerText);

        const currentQ = {
          q: rawQ.q,
          opts: shuffledOpts,
          ans: newAnswerIndex,
          trigger: rawQ.trigger
        };

        const duration = humanDurations[i] || (1100 + Math.random() * 800);
        accumulatedTimeMs += duration;

        await renderQuestionScene(currentQ, i + 1, totalStages, duration, mode);
      }

      // 3. Victory Outro Scene (Calculated Total Time & Mode URL)
      const totalClearSec = (accumulatedTimeMs / 1000).toFixed(2);
      await renderOutroScene(totalClearSec, mode);
    }

    function wait(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    /* ==========================================================================
       SCENE 1: HOOK INTRO SCENE (Mode Dynamic)
       ========================================================================== */
    async function renderIntroScene(mode, durationMs) {
      const start = performance.now();
      playBeep(440, 0.1);

      const isP67 = (mode === 'part67');
      const warningText = isP67 ? "※ 長文は全部読むな ※" : "※ TOEICは英語を読むな ※";
      const hookLine1 = isP67 ? "冒頭1行スナイプで" : "0.5秒の記号処理で";
      const hookLine2 = isP67 ? "Part 6&7 を秒殺する" : "Part 5 を秒殺する";
      const cardSub = isP67 ? "🎯 Part 6 & 7 目的スナイプ RTA 🎯" : "⚡ TOEIC 600 HACK RTA ⚡";

      while (performance.now() - start < durationMs) {
        const progress = (performance.now() - start) / durationMs;
        updateStatus("オープニング作成中...", progress * 15);

        // Background
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Red Warning Badge
        drawRoundRect(60, 200, W - 120, 60, 10, "#991b1b", "#ef4444", 2);
        drawText(warningText, W / 2, 230, "bold 28px sans-serif", "#ffffff");

        // Main Punch Title
        drawText(hookLine1, W / 2, 350, "bold 46px sans-serif", "#ffffff");
        drawText(hookLine2, W / 2, 420, "bold 50px sans-serif", isP67 ? "#38bdf8" : "#10b981");

        // Sub Card
        drawRoundRect(50, 520, W - 100, 260, 20, "#111827", "#374151", 2);
        drawText(cardSub, W / 2, 580, "bold 28px sans-serif", "#fbbf24");
        drawText("10問連続正解ストリーク実演", W / 2, 650, "bold 26px sans-serif", "#e5e7eb");
        drawText("（ミス・時間切れは即Stage 1リセット）", W / 2, 710, "20px sans-serif", "#9ca3af");

        // Ready CTA
        drawText("▶ STARTING DEMO ...", W / 2, 900, "bold 36px sans-serif", isP67 ? "#38bdf8" : "#10b981");

        await wait(16);
      }
    }

    /* ==========================================================================
       SCENE 2: QUESTION SOLVING SCENE (Mode Header & Layout)
       ========================================================================== */
    async function renderQuestionScene(qData, stageNum, totalStages, qDuration, mode) {
      const start = performance.now();
      let hasClicked = false;
      const clickPoint = 0.78; // Click happens around 78% of the question duration (human reaction)
      const isP67 = (mode === 'part67');
      const headerTitle = isP67 ? "🎯 TOEIC 600 Part 6&7 目的スナイプ [実演] 🎯" : "⚡ TOEIC 600 Part 5 品詞パズル [実演] ⚡";

      while (performance.now() - start < qDuration) {
        const elapsed = performance.now() - start;
        const progress = elapsed / qDuration;

        updateStatus(`Stage 0${stageNum} 実演解答中...`, (stageNum / totalStages) * 80 + 15);

        // Clear Background
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Header Top Bar
        drawRoundRect(0, 0, W, 120, 0, "#09090b", "#27272a", 1);
        drawText(headerTitle, W / 2, 60, "bold 22px sans-serif", isP67 ? "#38bdf8" : "#10b981");

        // Stage & Millisecond Timer (Strict 3.00s countdown)
        drawText(`STAGE 0${stageNum} / 10`, 60, 175, "bold 24px sans-serif", "#a1a1aa", "left");

        const remainingMs = Math.max(0, 3000 - elapsed * (3000 / qDuration));
        const sec = Math.floor(remainingMs / 1000);
        const mil = Math.floor((remainingMs % 1000) / 10);
        drawText(`0${sec}.${mil < 10 ? '0' + mil : mil}s`, W - 60, 175, "bold 44px monospace", remainingMs < 1000 ? "#ef4444" : "#10b981", "right");

        // Timer Progress Bar
        drawRoundRect(60, 205, W - 120, 10, 5, "#27272a");
        drawRoundRect(60, 205, (W - 120) * (remainingMs / 3000), 10, 5, remainingMs < 1000 ? "#ef4444" : "#10b981");

        // Question Card Box
        drawRoundRect(50, 245, W - 100, 290, 18, "#09090b", "#27272a", 2);

        // Render Multi-line Question Text
        renderQuestionSentence(qData.q, W / 2, 380, W - 140);

        // 4 Option Buttons
        const optY = 570;
        const optH = 92;
        const optGap = 18;

        qData.opts.forEach((opt, idx) => {
          const y = optY + idx * (optH + optGap);
          const isCorrect = (idx === qData.ans);
          const isClicked = progress >= clickPoint && isCorrect;

          if (isClicked) {
            // Selected Active Emerald Glow
            drawRoundRect(50, y, W - 100, optH, 14, "#064e3b", "#34d399", 4);
            drawRoundRect(70, y + 23, 46, 46, 8, "#10b981");
            drawText(['A', 'B', 'C', 'D'][idx], 93, y + 46, "bold 22px sans-serif", "#000000");
            drawText(opt, 140, y + 46, "bold 26px sans-serif", "#6ee7b7", "left");
            // Animated Checkmark
            drawText("✓", W - 90, y + 46, "bold 32px sans-serif", "#34d399");
          } else {
            // Normal Inactive Button
            drawRoundRect(50, y, W - 100, optH, 14, "#18181b", "#27272a", 2);
            drawRoundRect(70, y + 23, 46, 46, 8, "#27272a");
            drawText(['A', 'B', 'C', 'D'][idx], 93, y + 46, "bold 22px sans-serif", "#a1a1aa");
            drawText(opt, 140, y + 46, "bold 24px sans-serif", "#f4f4f5", "left");
          }
        });

        // Click Sound Trigger
        if (progress >= clickPoint && !hasClicked) {
          hasClicked = true;
          playBeep(1200, 0.06, 'sine');
        }

        // Trigger Rule Box (Bottom)
        drawRoundRect(50, 1030, W - 100, 160, 16, "#18181b", "#854d0e", 2);
        drawText("⚡ TRIGGER RULE（瞬殺判定根拠）", 80, 1070, "bold 19px sans-serif", "#fbbf24", "left");
        drawText(qData.trigger, 80, 1125, "bold 21px sans-serif", "#fef08a", "left");

        await wait(16);
      }
    }

    function renderQuestionSentence(rawText, cx, cy, maxW) {
      const formatted = rawText.replace(/_____/g, " [ _____ ] ");
      const words = formatted.split(' ');
      let lines = [];
      let currentLine = '';

      ctx.save();
      ctx.font = "bold 28px sans-serif";
      for (let w of words) {
        let test = currentLine ? currentLine + ' ' + w : w;
        if (ctx.measureText(test).width > maxW) {
          lines.push(currentLine);
          currentLine = w;
        } else {
          currentLine = test;
        }
      }
      if (currentLine) lines.push(currentLine);
      ctx.restore();

      const totalH = lines.length * 44;
      const startY = cy - (totalH / 2) + 20;

      lines.forEach((line, i) => {
        drawText(line, cx, startY + i * 44, "bold 28px sans-serif", "#ffffff");
      });
    }

    /* ==========================================================================
       SCENE 3: OUTRO CLEAR & CTA SCENE (Mode URL)
       ========================================================================== */
    async function renderOutroScene(clearTimeSec, mode) {
      const duration = 3500;
      const start = performance.now();
      playFanfare();

      const targetUrl = `https://33kasp33-cpu.github.io/eng/rta.html?mode=${mode}`;

      while (performance.now() - start < duration) {
        const progress = (performance.now() - start) / duration;
        updateStatus("エンディング作成中...", 95 + progress * 5);

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Gold Badge
        drawRoundRect(180, 180, W - 360, 48, 24, "#78350f", "#d97706", 2);
        drawText("★ MISSION COMPLETE ★", W / 2, 204, "bold 22px sans-serif", "#fbbf24");

        // Big Victory Title
        drawText("10 STREAK", W / 2, 300, "bold 56px sans-serif", "#ffffff");
        drawText("CLEARED!", W / 2, 370, "bold 60px sans-serif", "#10b981");

        // Clear Time Card
        drawRoundRect(50, 440, W - 100, 220, 20, "#111827", "#374151", 2);
        drawText("TOTAL CLEAR TIME", W / 2, 495, "bold 22px sans-serif", "#9ca3af");
        drawText(`${clearTimeSec}s`, W / 2, 580, "bold 72px monospace", "#34d399");

        // CTA Card
        drawRoundRect(50, 700, W - 100, 310, 20, "#78350f", "#f59e0b", 3);
        drawText("脳を鍛える反射ギプス", W / 2, 760, "bold 32px sans-serif", "#ffffff");
        drawText("今すぐ無料でプレイ可能！", W / 2, 820, "bold 26px sans-serif", "#fef08a");

        // Pulsing Link Button
        const p = Math.sin(progress * Math.PI * 6) * 5;
        drawRoundRect(80, 875 - p / 2, W - 160, 80 + p, 16, "#ffffff");
        drawText("プロフのリンクから 👉", W / 2, 915, "bold 32px sans-serif", "#000000");

        // Bottom Watermark URL
        drawText(targetUrl, W / 2, 1140, "20px monospace", "#6b7280");

        await wait(16);
      }
    }

    function updateStatus(text, pct) {
      document.getElementById('statusText').textContent = text;
      document.getElementById('timerText').textContent = `${Math.min(100, Math.round(pct))}%`;
    }

    // Initial Static Poster Frame
    window.addEventListener('DOMContentLoaded', () => {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, W, H);
      drawRoundRect(50, 450, W - 100, 300, 20, "#111827", "#374151", 2);
      drawText("⚡ PROMO GENERATOR v3.0 ⚡", W / 2, 560, "bold 32px sans-serif", "#10b981");
      drawText("上のボタンを押して動画を生成", W / 2, 630, "24px sans-serif", "#a1a1aa");
    });
  </script>
</body>
</html>
