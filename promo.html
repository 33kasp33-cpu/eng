<!DOCTYPE html>
<html lang="ja" class="h-full bg-neutral-950 text-white">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC 600 RTA | SNS Promo Video Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
  </style>
</head>
<body class="min-h-full flex flex-col items-center justify-center p-4 md:p-8 select-none">

  <!-- TOP HEADER -->
  <div class="max-w-xl w-full text-center space-y-2 mb-6">
    <div class="inline-block px-3 py-1 bg-amber-950 border border-amber-800 text-amber-400 font-black text-xs rounded-full uppercase tracking-wider">
      TikTok / Shorts / X Promo Generator
    </div>
    <h1 class="text-2xl md:text-3xl font-black tracking-tight">
      SNS用 縦型プロモ動画 自動生成エンジン
    </h1>
    <p class="text-xs md:text-sm text-neutral-400">
      「神速10連正解」のプレイ映像を効果音付きで自動レンダリングし、動画ファイルとしてダウンロードします。
    </p>
  </div>

  <!-- CONTROL PANEL -->
  <div class="max-w-xl w-full bg-neutral-900 border border-neutral-800 rounded-2xl p-5 mb-6 space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
      <div>
        <label class="block text-neutral-400 mb-1 font-bold">動画サイズ / 画角</label>
        <div class="p-2.5 bg-neutral-950 rounded border border-neutral-800 text-emerald-400 font-bold">
          縦型 9:16 (720 × 1280 HD)
        </div>
      </div>
      <div>
        <label class="block text-neutral-400 mb-1 font-bold">収録モード</label>
        <select id="videoModeSelect" class="w-full p-2 bg-neutral-950 rounded border border-neutral-800 text-white focus:outline-none focus:border-amber-400 font-bold">
          <option value="part5">Part 5 品詞パズル秒殺 (10問)</option>
          <option value="part67">Part 6/7 目的スナイプ秒殺 (10問)</option>
        </select>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-col sm:flex-row gap-3 pt-2">
      <button onclick="startRecording()" id="recordBtn" class="flex-1 py-3.5 bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-black font-black text-sm md:text-base rounded-xl transition shadow-lg shadow-emerald-950 flex items-center justify-center gap-2 cursor-pointer">
        <span>🎥</span>
        <span>動画を自動生成して保存 (.webm)</span>
      </button>
      <button onclick="previewOnly()" id="previewBtn" class="py-3.5 px-6 bg-neutral-800 hover:bg-neutral-700 active:scale-95 text-neutral-200 font-bold text-sm rounded-xl transition cursor-pointer">
        プレビュー再生
      </button>
    </div>

    <!-- STATUS BAR -->
    <div id="statusBox" class="hidden text-xs font-mono p-3 bg-neutral-950 rounded-lg border border-neutral-800 text-amber-400 flex items-center justify-between">
      <span id="statusText">レンダリング中: 0%</span>
      <span id="timerText">00.00s</span>
    </div>
  </div>

  <!-- CANVAS PREVIEW CONTAINER (9:16 Aspect Ratio) -->
  <div class="relative w-full max-w-[340px] aspect-[9/16] bg-black rounded-2xl overflow-hidden border-2 border-neutral-800 shadow-2xl">
    <canvas id="videoCanvas" width="720" height="1280" class="w-full h-full object-contain"></canvas>
  </div>

  <!-- FOOTER -->
  <div class="mt-6 text-center text-xs text-neutral-600 font-mono">
    TOEIC 600 HACK PROMO GENERATOR | ZERO-LATENCY SYSTEM
  </div>

  <script>
    /* ==========================================================================
       DEMO QUESTION DATA (Fast & Impressive Questions for Video)
       ========================================================================== */
    const DEMO_QUESTIONS = {
      part5: [
        { q: "The board members reached a final _____ yesterday.", opts: ["decide", "decision", "decisive", "decisively"], ans: 1, trigger: "冠詞 a + 形容詞 final の後 → 名詞 [-sion]" },
        { q: "The company needs a _____ supplier for materials.", opts: ["rely", "reliance", "reliable", "reliably"], ans: 2, trigger: "冠詞 a + _____ + 名詞 → 形容詞 [-able]" },
        { q: "The manager appreciated the _____ of the system.", opts: ["efficient", "efficiency", "efficiently", "efficiencies"], ans: 1, trigger: "冠詞 the + 前置詞 of の間 → 名詞 [-ty]" },
        { q: "The shipment was delivered _____ without damage.", opts: ["safe", "safely", "safety", "safeties"], ans: 1, trigger: "受動態 was delivered の後 → 副詞 [-ly]" },
        { q: "The committee will _____ review the proposal.", opts: ["careful", "carefully", "carefulness", "caring"], ans: 1, trigger: "助動詞 will + 本動詞の間 → 副詞 [-ly]" },
        { q: "Mr. Davis showed exceptional _____ conduct.", opts: ["profession", "professional", "professionally", "professionalism"], ans: 1, trigger: "形容詞 + _____ + 名詞 → 形容詞 [-al]" },
        { q: "Both parties finally signed the _____ yesterday.", opts: ["agree", "agreement", "agreeable", "agreeably"], ans: 1, trigger: "冠詞 the の後ろ（目的語）→ 名詞 [-ment]" },
        { q: "The firm revised its _____ strategy to boost sales.", opts: ["finance", "financial", "financially", "financier"], ans: 1, trigger: "所有格 its + _____ + 名詞 → 形容詞 [-al]" },
        { q: "Her outstanding _____ was recognized at the banquet.", opts: ["perform", "performance", "performer", "performed"], ans: 1, trigger: "所有格 + 形容詞の後 → 名詞 [-ance]" },
        { q: "The enterprise offers _____ prices to buyers.", opts: ["compete", "competition", "competitive", "competitively"], ans: 2, trigger: "動詞 offers + _____ + 名詞 → 形容詞 [-ive]" }
      ],
      part67: [
        { q: "Subject: Inquiry regarding bulk order discounts", opts: ["To request pricing info", "To cancel a shipment", "To complain of delay", "To apply for job"], ans: 0, trigger: "Subject: Inquiry regarding discounts → [価格の問い合わせ]" },
        { q: "I am writing to inquire about the warranty policy.", opts: ["To ask for policy details", "To request a refund", "To schedule repair", "To negotiate contract"], ans: 0, trigger: "I am writing to inquire → [問い合わせ (To ask)]" },
        { q: "Subject: Rescheduling of Friday's budget meeting", opts: ["To approve budget", "To change a meeting time", "To announce hiring", "To order supplies"], ans: 1, trigger: "Subject: Rescheduling → [会議日程の変更]" },
        { q: "We regret to inform you that the workshop is canceled.", opts: ["To announce a cancellation", "To schedule workshop", "To invite members", "To request feedback"], ans: 0, trigger: "We regret to inform ... canceled → [中止の通知]" },
        { q: "Apex Technologies is currently seeking a Sales Rep.", opts: ["To advertise open position", "To introduce rep", "To open new store", "To congratulate"], ans: 0, trigger: "currently seeking [役職] → [求人広告]" },
        { q: "This is a reminder that timesheets are due today.", opts: ["To remind of a deadline", "To introduce policy", "To recruit staff", "To grant time off"], ans: 0, trigger: "This is a reminder ... due → [提出期日のリマインド]" },
        { q: "Please be advised that the garage will be repaired.", opts: ["To inform of maintenance", "To sell passes", "To open facility", "To report accident"], ans: 0, trigger: "Please be advised ... maintenance → [保守点検の案内]" },
        { q: "Effective Oct 1, support hours will change to 8AM-6PM.", opts: ["To announce revised hours", "To hire staff", "To celebrate event", "To close department"], ans: 0, trigger: "Effective [日付], hours change → [営業時間変更]" },
        { q: "You are invited to attend the grand opening ceremony.", opts: ["To invite to an event", "To sell real estate", "To request funding", "To apply membership"], ans: 0, trigger: "You are invited to attend → [招待 (To invite)]" },
        { q: "Please find attached the finalized financial report.", opts: ["To provide documents", "To request invoice", "To delay payment", "To correct error"], ans: 0, trigger: "Please find attached the report → [書類送付]" }
      ]
    };

    /* ==========================================================================
       CANVAS 9:16 RENDERING ENGINE
       ========================================================================== */
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const W = 720;
    const H = 1280;

    let isRecording = false;
    let isPreview = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let audioCtx = null;
    let audioDest = null;

    // Web Audio Sound FX Generator
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioDest = audioCtx.createMediaStreamDestination();
      }
    }

    function playBeep(freq = 880, duration = 0.08, type = 'sine') {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioDest);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playFanfare() {
      if (!audioCtx) return;
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playBeep(freq, 0.25, 'triangle'), i * 120);
      });
    }

    /* ==========================================================================
       VIDEO GENERATION & TIMELINE SCRIPT
       ========================================================================== */
    async function startRecording() {
      initAudio();
      isRecording = true;
      isPreview = false;
      document.getElementById('recordBtn').disabled = true;
      document.getElementById('previewBtn').disabled = true;
      document.getElementById('statusBox').classList.remove('hidden');

      // Setup MediaRecorder from Canvas stream + Audio stream
      const canvasStream = canvas.captureStream(60);
      const combinedStream = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioDest.stream.getAudioTracks()
      ]);

      recordedChunks = [];
      const mimeTypes = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      let selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || '';

      mediaRecorder = new MediaRecorder(combinedStream, selectedMime ? { mimeType: selectedMime } : {});
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };
      mediaRecorder.onstop = exportVideoFile;
      mediaRecorder.start();

      await runPromoSequence();

      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('recordBtn').disabled = false;
      document.getElementById('previewBtn').disabled = false;
    }

    async function previewOnly() {
      initAudio();
      isRecording = false;
      isPreview = true;
      document.getElementById('recordBtn').disabled = true;
      document.getElementById('previewBtn').disabled = true;
      document.getElementById('statusBox').classList.remove('hidden');

      await runPromoSequence();

      isPreview = false;
      document.getElementById('recordBtn').disabled = false;
      document.getElementById('previewBtn').disabled = false;
    }

    function exportVideoFile() {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `TOEIC600_RTA_Promo_${Date.now()}.webm`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 500);
      document.getElementById('statusText').textContent = "✓ 動画のダウンロードが完了しました！";
    }

    /* ==========================================================================
       FRAME-BY-FRAME TIMELINE RUNNER
       ========================================================================== */
    async function runPromoSequence() {
      const mode = document.getElementById('videoModeSelect').value;
      const questions = DEMO_QUESTIONS[mode];
      const totalStages = 10;
      let stage = 1;
      let totalElapsed = 0;
      const startTime = performance.now();

      // Hook Intro (0.0s - 2.0s)
      await renderIntroScene(2000);

      // 10 Fast Questions Sequence (approx 1.0s each)
      for (let i = 0; i < totalStages; i++) {
        const qData = questions[i % questions.length];
        await renderQuestionScene(qData, i + 1, totalStages);
      }

      // Victory Outro Scene (approx 3.5s)
      await renderOutroScene();
    }

    function wait(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    /* ==========================================================================
       SCENE 1: HOOK INTRO SCENE (2.0s)
       ========================================================================== */
    async function renderIntroScene(durationMs) {
      const start = performance.now();
      playBeep(440, 0.1);

      while (performance.now() - start < durationMs) {
        const progress = (performance.now() - start) / durationMs;
        updateStatus("オープニング作成中...", progress * 15);

        // Background
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Top Hook Badge
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(60, 220, W - 120, 60);
        ctx.fillStyle = "#ffffff";
        ctx.font = "black 32px monospace";
        ctx.textAlign = "center";
        ctx.fillText("※ TOEICは英語を読むな ※", W / 2, 262);

        // Big Punch Title
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 52px monospace";
        ctx.fillText("0.5秒の記号処理で", W / 2, 380);
        ctx.fillStyle = "#10b981";
        ctx.fillText("Part 5 を秒殺する", W / 2, 450);

        // Subtitle Card
        ctx.fillStyle = "#171717";
        ctx.roundRect(60, 530, W - 120, 240, 20);
        ctx.fill();
        ctx.strokeStyle = "#333333";
        ctx.stroke();

        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 30px monospace";
        ctx.fillText("⚡ TOEIC 600 HACK RTA ⚡", W / 2, 600);

        ctx.fillStyle = "#d4d4d4";
        ctx.font = "26px monospace";
        ctx.fillText("10問連続正解ストリーク実演", W / 2, 670);
        ctx.fillStyle = "#a3a3a3";
        ctx.font = "22px monospace";
        ctx.fillText("（ミス・時間切れは即Stage 1リセット）", W / 2, 720);

        // Ready pulse
        const pulse = Math.sin(progress * Math.PI * 4) * 0.1 + 0.9;
        ctx.fillStyle = "#10b981";
        ctx.font = "900 40px monospace";
        ctx.fillText("▶ START DEMO ...", W / 2, 900);

        await wait(16);
      }
    }

    /* ==========================================================================
       SCENE 2: QUESTION SOLVING SCENE (0.9s ~ 1.1s per question)
       ========================================================================== */
    async function renderQuestionScene(qData, stageNum, totalStages) {
      const qDuration = 950; // 0.95 seconds per question
      const start = performance.now();
      let hasClicked = false;

      while (performance.now() - start < qDuration) {
        const elapsed = performance.now() - start;
        const progress = elapsed / qDuration;

        updateStatus(`Stage 0${stageNum} 爆速解答中...`, (stageNum / totalStages) * 80 + 15);

        // Draw Game Screen on Canvas
        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Top Header Banner
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, W, 140);
        ctx.fillStyle = "#10b981";
        ctx.font = "900 28px monospace";
        ctx.textAlign = "center";
        ctx.fillText("⚡ TOEIC 600 記号処理 RTA [実演] ⚡", W / 2, 85);

        // Status Bar: STAGE & TIMER
        ctx.fillStyle = "#a3a3a3";
        ctx.font = "bold 26px monospace";
        ctx.textAlign = "left";
        ctx.fillText(`STAGE 0${stageNum} / 10`, 60, 200);

        // Millisecond Timer
        const remainingMs = Math.max(0, 3000 - elapsed * 2);
        const sec = Math.floor(remainingMs / 1000);
        const mil = Math.floor((remainingMs % 1000) / 10);
        ctx.textAlign = "right";
        ctx.fillStyle = "#10b981";
        ctx.font = "900 48px monospace";
        ctx.fillText(`0${sec}.${mil < 10 ? '0' + mil : mil}s`, W - 60, 200);

        // Timer Bar
        ctx.fillStyle = "#1f2937";
        ctx.fillRect(60, 220, W - 120, 12);
        ctx.fillStyle = "#10b981";
        ctx.fillRect(60, 220, (W - 120) * (remainingMs / 3000), 12);

        // Question Card Area
        ctx.fillStyle = "#0a0a0a";
        ctx.roundRect(60, 270, W - 120, 280, 16);
        ctx.fill();
        ctx.strokeStyle = "#262626";
        ctx.lineWidth = 2;
        ctx.stroke();

        // Question Text (Wrap)
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px monospace";
        ctx.textAlign = "center";
        wrapText(ctx, qData.q.replace(/_____/g, " [ _____ ] "), W / 2, 380, W - 160, 48);

        // 4 Options Grid
        const optY = 590;
        const optH = 95;
        const optGap = 20;

        qData.opts.forEach((opt, idx) => {
          const y = optY + idx * (optH + optGap);
          const isCorrect = (idx === qData.ans);
          const isClicked = progress > 0.65 && isCorrect;

          // Box Background
          if (isClicked) {
            ctx.fillStyle = "#064e3b"; // Active Green
            ctx.strokeStyle = "#10b981";
            ctx.lineWidth = 4;
          } else {
            ctx.fillStyle = "#171717";
            ctx.strokeStyle = "#262626";
            ctx.lineWidth = 2;
          }

          ctx.roundRect(60, y, W - 120, optH, 12);
          ctx.fill();
          ctx.stroke();

          // Option Letter Badge
          ctx.fillStyle = isClicked ? "#10b981" : "#333333";
          ctx.fillRect(80, y + 25, 45, 45);
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 24px monospace";
          ctx.textAlign = "center";
          ctx.fillText(['A', 'B', 'C', 'D'][idx], 102, y + 56);

          // Option Text
          ctx.fillStyle = isClicked ? "#34d399" : "#f3f4f6";
          ctx.font = "bold 28px monospace";
          ctx.textAlign = "left";
          ctx.fillText(opt, 145, y + 58);
        });

        // Click trigger sound at 65% progress
        if (progress > 0.65 && !hasClicked) {
          hasClicked = true;
          playBeep(1200, 0.06, 'sine');
        }

        // Trigger Hint Badge at bottom
        ctx.fillStyle = "#171717";
        ctx.roundRect(60, 1070, W - 120, 140, 14);
        ctx.fill();
        ctx.strokeStyle = "#854d0e";
        ctx.stroke();

        ctx.fillStyle = "#fbbf24";
        ctx.font = "bold 20px monospace";
        ctx.textAlign = "left";
        ctx.fillText("⚡ TRIGGER RULE（瞬殺根拠）", 85, 1110);
        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 22px monospace";
        ctx.fillText(qData.trigger, 85, 1155);

        await wait(16);
      }
    }

    /* ==========================================================================
       SCENE 3: OUTRO CLEAR & CTA SCENE (3.5s)
       ========================================================================== */
    async function renderOutroScene() {
      const duration = 3500;
      const start = performance.now();
      playFanfare();

      while (performance.now() - start < duration) {
        const progress = (performance.now() - start) / duration;
        updateStatus("エンディング作成中...", 95 + progress * 5);

        ctx.fillStyle = "#000000";
        ctx.fillRect(0, 0, W, H);

        // Gold Badge
        ctx.fillStyle = "#78350f";
        ctx.fillRect(160, 200, W - 320, 50);
        ctx.fillStyle = "#fbbf24";
        ctx.font = "900 24px monospace";
        ctx.textAlign = "center";
        ctx.fillText("★ MISSION COMPLETE ★", W / 2, 235);

        // Big Victory Title
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 56px monospace";
        ctx.fillText("10 STREAK", W / 2, 340);
        ctx.fillStyle = "#10b981";
        ctx.fillText("CLEARED!", W / 2, 410);

        // Result Card
        ctx.fillStyle = "#111827";
        ctx.roundRect(60, 480, W - 120, 220, 20);
        ctx.fill();
        ctx.strokeStyle = "#374151";
        ctx.stroke();

        ctx.fillStyle = "#9ca3af";
        ctx.font = "bold 24px monospace";
        ctx.fillText("TOTAL CLEAR TIME", W / 2, 540);

        ctx.fillStyle = "#34d399";
        ctx.font = "900 70px monospace";
        ctx.fillText("09.48s", W / 2, 630);

        // CTA Banner (Profile Link Lead)
        ctx.fillStyle = "#b45309";
        ctx.roundRect(60, 750, W - 120, 280, 20);
        ctx.fill();
        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 34px monospace";
        ctx.fillText("脳を鍛える反射ギプス", W / 2, 820);

        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 28px monospace";
        ctx.fillText("今すぐ無料でプレイ可能！", W / 2, 880);

        // Pulsing Link Button
        const p = Math.sin(progress * Math.PI * 6) * 6;
        ctx.fillStyle = "#ffffff";
        ctx.roundRect(90, 925 - p / 2, W - 180, 75 + p, 14);
        ctx.fill();

        ctx.fillStyle = "#000000";
        ctx.font = "900 32px monospace";
        ctx.fillText("プロフのリンクから 👉", W / 2, 975);

        // Bottom Watermark
        ctx.fillStyle = "#6b7280";
        ctx.font = "20px monospace";
        ctx.fillText("https://33kasp33-cpu.github.io/eng/rta.html", W / 2, 1150);

        await wait(16);
      }
    }

    /* ==========================================================================
       HELPERS & TEXT WRAPPING
       ========================================================================== */
    function updateStatus(text, pct) {
      document.getElementById('statusText').textContent = text;
      document.getElementById('timerText').textContent = `${Math.min(100, Math.round(pct))}%`;
    }

    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = context.measureText(testLine);
        const testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, currentY);
    }

    // Initial Static Render
    window.addEventListener('DOMContentLoaded', () => {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#10b981";
      ctx.font = "bold 32px monospace";
      ctx.textAlign = "center";
      ctx.fillText("⚡ PROMO GENERATOR READY ⚡", W / 2, H / 2 - 20);
      ctx.fillStyle = "#a3a3a3";
      ctx.font = "24px monospace";
      ctx.fillText("上のボタンを押して生成開始", W / 2, H / 2 + 30);
    });
  </script>
</body>
